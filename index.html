    const load=()=>{const ses=DB.get(code);if(!ses)return;const arr=Object.values(ses.messages||{}).sort((a,b)=>a.ts-b.ts);setMsgs(arr);const lc=arr.filter(m=>m.sender==='customer').at(-1);const la=arr.filter(m=>m.sender==='agent').at(-1);if(lc&&lc.ts!==lastCMT){setLastCMT(lc.ts);setNrt(0);}setNrtActive(!!lc&&(!la||lc.ts>la.ts));if(view==='wait'&&arr.length>0&&role==='agent')setView('chat');if(ses.closed&&!isClosed)setIsClosed(true);};
    load();
    const stopFirebase=DB.listen(code,load);
    const bch=e=>{if(e.data.c===code)load();};
    BC?.addEventListener('message',bch);
    const poll=setInterval(load,1000);

  },[code,view,role,lastCMT,isClosed]);
  useEffect(()=>{chatEnd.current?.scrollIntoView({behavior:'smooth'});},[msgs]);
  const handleCreate=diff=>{const pool=SC.filter(s=>s.diff===diff);if(!pool.length)return;const sc=pool[Math.floor(Math.random()*pool.length)];const nm=prompt('Tu nombre (Agente):');if(!nm?.trim())return;setAgentName(nm.trim());const tryPeer=(pc,n=0)=>{DB.set(pc,{scenario:sc,messages:{},closed:false});if(n>2){setCode(pc);setScenario(sc);setView('wait');return;}const p=new Peer('bm5es-'+pc,PCFG);PR.current=p;p.on('open',()=>{setCode(pc);setScenario(sc);setView('wait');});p.on('connection',conn=>{CR.current=conn;conn.on('open',()=>{const ses=DB.get(pc);conn.send({type:'INIT',sc,ms:ses?.messages||{}});setView('chat');});conn.on('data',d=>onPData(d,pc));});p.on('error',err=>{if(err.type==='unavailable-id')tryPeer(genID(),n+1);else{setCode(pc);setScenario(sc);setView('wait');}});};tryPeer(genID());};
  const handleJoin=()=>{if(inputCode.length!==6)return;const rc=inputCode.toUpperCase();let fallbackUsed=false;const fbk=async()=>{if(fallbackUsed)return;fallbackUsed=true;const ses=await DB.load(rc);if(ses){setCode(rc);setScenario(ses.scenario);if(role==='agent'){const n=prompt('Tu nombre:');if(!n)return;setAgentName(n);setView('wait');}else setView('chat');}else alert('¡Sesión no encontrada! Pide el código al Agente.');};const p=new Peer(PCFG);PR.current=p;p.on('open',()=>{const conn=p.connect('bm5es-'+rc,{reliable:true});CR.current=conn;let got=false;conn.on('data',d=>{onPData(d,rc);if(d.type==='INIT')got=true;});conn.on('open',()=>setTimeout(()=>{if(!got)fbk();},6000));conn.on('error',fbk);});p.on('error',fbk);};
  const handleSend=()=>{if(!input.trim()||isClosed)return;let mac=null;for(const m of MACROS){if(m.text===input.trim()||simil(input.trim(),m.text)>=50){mac=m;break;}}if(mac&&!macrosUsed.includes(mac.id))setMacrosUsed(p=>[...p,mac.id]);let txt=input.trim();if(role==='agent')txt=txt.replace(/{CUSTOMER_FNAME}/g,scenario?.cust?.name?.split(' ')[0]||'').replace(/{CURRENT_USER_FNAME}/g,agentName);bcast('m'+Date.now(),{sender:role,text:txt,ts:Date.now(),messageType:mt});setInput('');setLastAct(Date.now());if(role==='agent'&&!frtDone)setFrtDone(true);if(role==='agent'){setNrtActive(false);setNrt(0);}if(mac&&(mac.id==='M6'||mac.id==='M7')){DB.close(RC.current);CR.current?.open&&CR.current.send({type:'CLOSE'});}};
  const handleFile=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Máximo 5MB.');if(fileRef.current)fileRef.current.value='';return;}if(fileRef.current)fileRef.current.value='';setUploading(true);try{const data=await compressImg(f);if(!data){setUploading(false);alert('No se pudo procesar el archivo.');return;}bcast('m'+Date.now(),{sender:role,text:'📎 '+f.name,fileUrl:data,fileName:f.name,fileType:f.type,ts:Date.now(),messageType:mt});setLastAct(Date.now());}catch{alert('Error al subir.');}setUploading(false);};
  const calcQA=()=>{const frtSc=frtDone?(frt>50?25:frt>40?20:frt>30?15:frt>0?10:5):0;const nrtSc=nrt<=60?20:nrt<=120?15:nrt<=180?10:5;let macSc=0;if(macrosUsed.includes('M1'))macSc+=10;if(macrosUsed.includes('M6')||macrosUsed.includes('M7'))macSc+=10;if(macrosUsed.includes('M5'))macSc+=3;macSc+=Math.min(macrosUsed.filter(m=>['M2','M3','M4','M8'].includes(m)).length*2,6);macSc=Math.min(macSc,29);const empSc=calcEmpathy(msgs,scenario);let tickSc=0;if(ticketDone){const ref={Principiante:{st:'resuelto',pr:'normal'},Intermedio:{st:'pendiente',pr:'alta'},Avanzado:{st:'abierto',pr:'urgente'}}[scenario?.diff]||{};if(ticketStatus===ref.st)tickSc+=5;else if(ticketStatus)tickSc+=2;if(ticketPriority===ref.pr)tickSc+=3;else if(ticketPriority)tickSc+=1;if(ticketCategory)tickSc+=2;}return{frtSc,nrtSc,macSc,empSc,tickSc,total:frtSc+nrtSc+macSc+empSc+tickSc};};
  const reset=()=>{PR.current?.destroy();PR.current=null;CR.current=null;setView('home');setRole(null);setCode('');setScenario(null);setMsgs([]);setInput('');setMt('REPLY');setAgentName('');setTime(0);setFrt(60);setFrtDone(false);setNrt(0);setNrtActive(false);setLastCMT(0);setMacrosUsed([]);setShowQA(false);setIsClosed(false);setTicketStatus('');setTicketPriority('');setTicketCategory('');setTicketDone(false);setLastAct(Date.now());};
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const bCnt=SC.filter(s=>s.diff==='Principiante').length,iCnt=SC.filter(s=>s.diff==='Intermedio').length,aCnt=SC.filter(s=>s.diff==='Avanzado').length;
  if(view==='home')return(<div className="min-h-screen bg-gradient-to-br from-purple-700 to-blue-600 flex items-center justify-center p-4"><div className="max-w-3xl w-full bg-white rounded-3xl shadow-2xl p-10"><h1 className="text-4xl font-bold text-center mb-2 bg-gradient-to-r from-purple-700 to-blue-600 bg-clip-text text-transparent">🎓 BM Entrenamiento Chat EN VIVO</h1><p className="text-center text-gray-400 text-sm mb-8">🌐 P2P · {bCnt} Principiante · {iCnt} Intermedio · {aCnt} Avanzado · ES v5</p><div className="grid md:grid-cols-2 gap-6"><div onClick={()=>{setRole('agent');setView('join');}} className="cursor-pointer bg-gradient-to-br from-green-500 to-emerald-700 p-10 rounded-2xl text-white text-center hover:scale-105 transition-transform shadow-lg"><div className="text-5xl mb-2">🎧</div><h3 className="text-2xl font-bold">Agente</h3><p className="opacity-75 text-sm mt-1">FRT · NRT · Macros · QA · Ticket</p></div><div onClick={()=>{setRole('customer');setView('join');}} className="cursor-pointer bg-gradient-to-br from-purple-500 to-purple-800 p-10 rounded-2xl text-white text-center hover:scale-105 transition-transform shadow-lg"><div className="text-5xl mb-2">💬</div><h3 className="text-2xl font-bold">Cliente</h3><p className="opacity-75 text-sm mt-1">Roleplay de escenarios reales</p></div></div></div></div>);
  if(view==='join')return(<div className="min-h-screen bg-gradient-to-br from-purple-700 to-blue-600 flex items-center justify-center p-4"><div className="max-w-2xl w-full"><button onClick={()=>setView('home')} className="mb-4 px-4 py-2 bg-white rounded-xl text-sm shadow">← Volver</button><div className="bg-white rounded-3xl shadow-2xl p-8"><h2 className="text-2xl font-bold text-center mb-2">Unirse o Crear Sesión</h2><p className="text-center mb-6"><span className="px-4 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-semibold">{role==='agent'?'🎧 Agente':'💬 Cliente'}</span></p><div className="bg-green-50 border-4 border-green-300 rounded-2xl p-5 mb-5"><h3 className="font-bold mb-3">Unirse con código</h3><div className="flex gap-3"><input value={inputCode} onChange={e=>setInputCode(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&inputCode.length===6&&handleJoin()} placeholder="XXXXXX" maxLength={6} className="flex-1 px-4 py-3 border-4 rounded-xl text-center text-xl font-mono font-bold uppercase tracking-widest"/><button onClick={handleJoin} disabled={inputCode.length!==6} className="px-6 py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700 disabled:opacity-40">Unirse</button></div></div>{role==='agent'&&(<><p className="text-center font-bold text-gray-400 my-4">— O CREAR NUEVA SESIÓN —</p><div className="grid grid-cols-3 gap-3"><button onClick={()=>handleCreate('Principiante')} className="py-5 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold">🟢 Principiante</button><button onClick={()=>handleCreate('Intermedio')} className="py-5 bg-yellow-600 hover:bg-yellow-700 text-white rounded-xl font-bold">🟡 Intermedio</button><button onClick={()=>handleCreate('Avanzado')} className="py-5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold">🔴 Avanzado</button></div></>)}{role==='customer'&&<p className="text-center text-sm text-gray-500 mt-4">💡 Obtén el código de 6 letras de tu Agente. ¡Funciona entre dispositivos!</p>}</div></div></div>);
  if(view==='wait')return(<div className="min-h-screen bg-gradient-to-br from-purple-700 to-blue-600 flex items-center justify-center p-4"><div className="bg-white rounded-3xl shadow-2xl p-10 max-w-md w-full text-center"><h2 className="text-2xl font-bold mb-4">⏳ Esperando al Cliente</h2><div className="bg-green-50 border-4 border-green-500 rounded-2xl p-6 mb-4"><p className="text-sm font-semibold mb-3">Comparte este código:</p><div className="flex items-center justify-center gap-3"><div className="bg-white px-8 py-5 rounded-xl border-4 border-green-600 shadow"><p className="text-5xl font-bold font-mono text-green-700 tracking-widest">{code}</p></div><button onClick={()=>{navigator.clipboard.writeText(code);setCopied(true);setTimeout(()=>setCopied(false),2000);}} className="w-14 h-14 border-4 rounded-xl text-xl hover:bg-gray-50">{copied?'✓':'📋'}</button></div></div><p className="text-purple-600 font-semibold animate-pulse text-sm">Conectando vía P2P…</p><button onClick={reset} className="mt-4 px-5 py-2 bg-gray-200 rounded-xl text-sm hover:bg-gray-300">Cancelar</button></div></div>);
  if(!scenario)return null;
  if(role==='agent'){
    const canFinish=macrosUsed.includes('M6')||macrosUsed.includes('M7');const nrtC=nrt>=180?'bg-red-600 animate-pulse':nrt>=120?'bg-orange-500':'bg-green-600';
    return(<div className="w-full h-screen flex flex-col overflow-hidden">
      <div className="bg-gradient-to-r from-purple-700 to-blue-600 text-white px-4 py-2 flex justify-between items-center flex-shrink-0"><div className="flex items-center gap-2"><span className="font-bold text-sm">{scenario.title}</span><span className="text-xs px-2 py-0.5 bg-white bg-opacity-20 rounded">{code}</span><span className="text-xs px-2 py-0.5 bg-white bg-opacity-20 rounded">{scenario.diff}</span></div><div className="flex items-center gap-2">{!frtDone&&<div className={`px-2 py-0.5 rounded font-bold text-xs ${frt<=10?'bg-red-500 animate-pulse':frt<=30?'bg-orange-500':'bg-green-600'}`}>FRT {frt}s</div>}{nrtActive&&<div className={`px-2 py-0.5 rounded font-bold text-xs ${nrtC}`}>NRT {fmt(nrt)}</div>}<div className="px-2 py-0.5 bg-white bg-opacity-20 rounded font-mono text-xs">{fmt(time)}</div><button onClick={reset} className="px-3 py-1 bg-white text-purple-700 rounded font-semibold text-xs">Salir</button></div></div>
      <div className="flex-1 flex overflow-hidden">
        <div className="w-64 bg-gray-50 border-r flex flex-col overflow-y-auto flex-shrink-0 p-3 gap-2 text-xs">
          <div className="bg-white p-3 rounded-xl shadow-sm"><p className="font-bold text-gray-400 mb-1">PEDIDO</p><p className="font-semibold">{scenario.cust.device}</p><p className="text-gray-500">{scenario.cust.grade} · {scenario.cust.price}</p><p className="text-gray-400">{scenario.cust.order}</p></div>
          <div className="bg-purple-50 p-3 rounded-xl border border-purple-200"><p className="font-bold text-purple-700 mb-1">ESTADO DE ÁNIMO</p><p className="font-semibold text-purple-800">{scenario.mood}</p></div>
          <div className="bg-blue-50 p-3 rounded-xl"><p className="font-bold text-blue-700 mb-2">MACROS ({macrosUsed.length} usadas)</p>{MACROS.filter(m=>mt==='NOTE'?true:!m.noteOnly).map(m=>(<button key={m.id} onClick={()=>setInput(m.text)} className={`w-full mb-1 px-2 py-1.5 rounded-lg text-left text-xs ${macrosUsed.includes(m.id)?'bg-blue-600 text-white':'bg-white hover:bg-blue-50 border'}`}><strong>{m.id}</strong> {m.title}{macrosUsed.includes(m.id)?' ✓':''}</button>))}</div>
          {scenario.diff!=='Avanzado'&&<div className="bg-emerald-50 p-3 rounded-xl border border-emerald-200"><p className="font-bold text-emerald-700 mb-1">CAMINO SUGERIDO</p>{scenario.path.map((p,i)=><p key={i} className="mb-0.5">✓ {p}</p>)}</div>}
          <div className="bg-amber-50 p-3 rounded-xl border border-amber-200"><p className="font-bold text-amber-700 mb-1">RETOS</p>{scenario.chal.map((c,i)=><p key={i} className="mb-0.5">⚠ {c}</p>)}</div>
        </div>
        <div className="flex-1 flex flex-col overflow-hidden">
          <div className="flex-1 overflow-y-auto p-3 space-y-2 bg-gray-50">
            {msgs.length===0&&<p className="text-center text-gray-400 mt-8 text-sm">⏳ Esperando el primer mensaje del cliente…</p>}
            {msgs.map((m,i)=>(<div key={i} className={`flex ${m.sender==='agent'?'justify-end':m.sender==='system'?'justify-center':'justify-start'}`}><div className={`max-w-sm px-3 py-2 rounded-2xl text-sm shadow-sm ${m.sender==='agent'?m.messageType==='NOTE'?'bg-yellow-100 border-2 border-yellow-400 text-gray-800':'bg-blue-600 text-white':m.sender==='system'?'automsg text-gray-700 text-xs':'bg-white border'}`}>{m.messageType==='NOTE'&&<p className="text-xs font-bold text-yellow-700 mb-1">📝 NOTA INTERNA</p>}<p>{m.text}</p>{m.fileUrl&&<div className="mt-1">{m.fileType?.startsWith('image/')?<img src={m.fileUrl} alt={m.fileName} className="fp"/>:<a href={m.fileUrl} target="_blank" rel="noopener noreferrer" className="underline text-xs">📎 {m.fileName}</a>}</div>}</div></div>))}
            <div ref={chatEnd}/>
          </div>
          <div className="border-t bg-white p-3 flex-shrink-0">
            <div className="flex gap-2 mb-1"><button onClick={()=>setMt('REPLY')} className={`px-3 py-1 rounded text-xs font-bold ${mt==='REPLY'?'bg-blue-600 text-white':'bg-gray-200'}`}>RESPONDER</button><button onClick={()=>setMt('NOTE')} className={`px-3 py-1 rounded text-xs font-bold ${mt==='NOTE'?'bg-yellow-500 text-white':'bg-gray-200'}`}>NOTA</button></div>
            <div className="flex gap-2 mb-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isClosed&&handleSend()} disabled={isClosed} placeholder={isClosed?'Chat cerrado':mt==='NOTE'?'Nota interna…':'Mensaje…'} className="flex-1 px-3 py-2 border-2 rounded-xl text-sm disabled:bg-gray-100"/><button onClick={handleSend} disabled={isClosed} className={`px-4 py-2 rounded-xl text-sm font-semibold ${mt==='NOTE'?'bg-yellow-500 text-white':'bg-blue-600 text-white'} disabled:opacity-40`}>{mt==='NOTE'?'Nota':'Enviar'}</button></div>
            <div className="flex gap-2 mb-2 text-xs"><input type="file" ref={fileRef} onChange={handleFile} accept="image/*,.pdf,.doc,.docx,.txt" style={{display:'none'}}/><button onClick={()=>fileRef.current?.click()} disabled={uploading||isClosed} className="text-gray-500 hover:text-gray-700 disabled:opacity-40">{uploading?'⏳ Subiendo…':'📎 Adjuntar'}</button></div>
            <div className="border-t pt-2"><p className="text-xs font-bold text-gray-500 mb-1">🎫 TICKET {ticketDone&&<span className="text-green-600 ml-1">✓ Enviado</span>}</p><div className="flex gap-2"><select value={ticketStatus} onChange={e=>setTicketStatus(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Estado…</option><option value="abierto">Abierto</option><option value="pendiente">Pendiente</option><option value="resuelto">Resuelto</option><option value="cerrado">Cerrado</option></select><select value={ticketPriority} onChange={e=>setTicketPriority(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Prioridad…</option><option value="baja">Baja</option><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select><select value={ticketCategory} onChange={e=>setTicketCategory(e.target.value)} disabled={ticketDone} className="flex-1 px-2 py-1 border rounded text-xs"><option value="">Categoría…</option><option value="entrega">Entrega</option><option value="estado">Estado</option><option value="devolucion">Devolución</option><option value="tecnico">Técnico</option><option value="garantia">Garantía</option><option value="cuenta">Cuenta</option></select><button onClick={()=>setTicketDone(true)} disabled={ticketDone||(!ticketStatus&&!ticketPriority)} className="px-3 py-1 bg-purple-600 text-white rounded text-xs font-bold hover:bg-purple-700 disabled:opacity-40">{ticketDone?'✓':'Enviar'}</button></div></div>
          </div>
        </div>
      </div>
      {canFinish&&!showQA&&<div className="bg-green-50 border-t-2 border-green-400 p-2 text-center flex-shrink-0"><button onClick={()=>setShowQA(true)} className="px-6 py-2 bg-green-600 text-white rounded-xl font-bold text-sm hover:bg-green-700">✓ Finalizar y Ver Puntuación QA</button></div>}
      {showQA&&(()=>{const q=calcQA();return(<div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50"><div className="bg-white rounded-2xl p-6 max-w-2xl w-full overflow-y-auto max-h-screen"><h2 className="text-xl font-bold text-center mb-4">📊 Evaluación QA</h2><div className="grid grid-cols-5 gap-2 mb-4">{[['FRT',q.frtSc,25,'green'],['NRT',q.nrtSc,20,'orange'],['Macros',q.macSc,29,'blue'],['Empatía',q.empSc,25,'purple'],['Ticket',q.tickSc,10,'indigo']].map(([l,s,m,c])=>(<div key={l} className={`p-3 rounded-xl text-center bg-${c}-50 border border-${c}-200`}><p className="text-xs font-bold text-gray-500">{l}</p><p className={`text-2xl font-bold text-${c}-600`}>{s}/{m}</p></div>))}</div><div className="bg-gradient-to-r from-purple-100 to-blue-100 p-5 rounded-xl text-center mb-4"><p className="text-5xl font-bold text-purple-700">{q.total}/109</p><p className="mt-1 text-sm">{q.total>=90?'🌟 ¡Sobresaliente!':q.total>=70?'✅ ¡Buen trabajo!':q.total>=50?'📈 Sigue mejorando':'💪 Practica más'}</p></div><div className="bg-amber-50 p-4 rounded-xl mb-4 text-sm"><p className="font-bold mb-1">Ticket: Estado (+5) · Prioridad (+3) · Categoría (+2)</p>{ticketDone?<p>Enviado: <strong>{ticketStatus}</strong> / <strong>{ticketPriority}</strong> / <strong>{ticketCategory||'–'}</strong></p>:<p className="text-red-600">⚠ No se envió ticket.</p>}</div><div className="flex gap-3"><button onClick={()=>setShowQA(false)} className="flex-1 py-2 bg-gray-200 rounded-xl text-sm">Cerrar</button><button onClick={reset} className="flex-1 py-2 bg-purple-600 text-white rounded-xl font-bold text-sm">Nueva Sesión</button></div></div></div>);})()}
    </div>);
  }
  return(<div className="min-h-screen bg-gray-100 flex items-center justify-center p-4"><div className="w-full max-w-sm"><button onClick={reset} className="mb-3 px-4 py-2 bg-white rounded-xl shadow text-sm">← Salir</button><div className="bg-white rounded-2xl shadow-xl overflow-hidden"><div className="bg-green-500 text-white p-3"><h2 className="font-bold">Soporte Back Market</h2><p className="text-xs opacity-70">Sesión: {code}</p></div>{scenario.hints&&(<div className="bg-yellow-50 border-b-2 border-yellow-200 p-3"><p className="text-xs font-bold text-yellow-800 mb-1">🎭 {scenario.mood}</p><ul className="text-xs text-yellow-700 space-y-0.5">{scenario.hints.map((h,i)=><li key={i}>• {h}</li>)}</ul></div>)}<div className="h-96 overflow-y-auto p-3 space-y-2 bg-gray-50">{isClosed&&<div className="bg-red-50 border-2 border-red-300 rounded-xl p-3 text-center text-red-700 font-bold text-sm">🔴 El agente cerró la conversación</div>}{msgs.length===0&&(<div className="bg-amber-50 rounded-xl p-3 border"><p className="font-semibold text-sm">🎭 {scenario.cust.name}</p><p className="text-xs text-gray-500 mb-1">{scenario.cust.device} · {scenario.cust.order}</p><p className="text-xs text-orange-700 font-semibold">Envía tu mensaje inicial:</p><p className="text-xs text-gray-500 italic mt-1">💡 Sugerido: "{scenario.msg}"</p></div>)}{msgs.map((m,i)=>m.messageType!=='NOTE'&&(<div key={i} className={`flex ${m.sender==='customer'?'justify-end':m.sender==='system'?'justify-center':'justify-start'}`}><div className={`px-3 py-2 rounded-xl max-w-xs text-sm ${m.sender==='customer'?'bg-green-500 text-white':m.sender==='system'?'automsg text-gray-600 text-xs':'bg-white border shadow-sm'}`}><p>{m.text}</p>{m.fileUrl&&<div className="mt-1">{m.fileType?.startsWith('image/')?<img src={m.fileUrl} alt={m.fileName} className="fp"/>:<a href={m.fileUrl} target="_blank" rel="noopener noreferrer" className="underline text-xs">📎 {m.fileName}</a>}</div>}</div></div>))}<div ref={chatEnd}/></div><div className="border-t p-3"><div className="flex gap-2"><input type="file" ref={fileRef} onChange={handleFile} accept="image/*,.pdf,.doc,.docx,.txt" style={{display:'none'}}/><button onClick={()=>fileRef.current?.click()} disabled={uploading||isClosed} className="text-lg disabled:opacity-40">{uploading?'⏳':'📎'}</button><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!isClosed&&handleSend()} disabled={isClosed} placeholder={isClosed?'Cerrado':'Escribe tu mensaje…'} className="flex-1 px-3 py-2 border-2 rounded-full text-sm disabled:bg-gray-100"/><button onClick={handleSend} disabled={isClosed} className="px-4 py-2 bg-green-500 text-white rounded-full text-sm font-semibold disabled:opacity-40">Enviar</button></div></div></div></div></div>);
}
ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script></body></html>
